<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Convert to it!</title>
  
  <meta name="url" content="https://convert.to.it">
  <meta name="identifier-URL" content="https://convert.to.it">
  <meta name="og:url" content="https://convert.to.it"/>
  <meta name="og:title" content="Convert to it!"/>
  <meta name="og:site_name" content="Convert to it!"/>
  <meta name="og:description" content="Truly universal online file converter. Private, on-device conversion across mediums."/>
  <meta name="og:image" content="https://p2r3.github.io/convert/assets/favicon-Bfod-rsk.ico"/>
  <meta name="theme-color" content="#1C77FF"/>
  <meta name="og:type" content="website"/>
</head>
<body>

  <input id="file-input" type="file" multiple>

  <div id="format-containers">
    <header id="app-header">
      <div>
        <p class="eyebrow">Convert to it</p>
        <h1>Local file conversion</h1>
      </div>
      <p>Files stay on this device.</p>
    </header>

    <section id="source-summary" class="source-summary" aria-live="polite" role="button" tabindex="0">
      <div>
        <p class="eyebrow">Input</p>
        <h2>No file selected</h2>
        <p>Choose a local file here and the input format will be detected automatically.</p>
      </div>
      <button id="change-file-button" type="button">Choose file</button>
    </section>

    <div id="from-container" class="format-container" hidden>
      <h2>Convert from:</h2>
      <input type="text" id="search-from" class="search" placeholder="Search">
      <div id="from-list" class="format-list">

      </div>
    </div>

    <div id="to-container" class="format-container">
      <div class="format-heading">
        <h2>Convert to:</h2>
        <button id="convert-button" class="disabled" hidden>Convert</button>
      </div>
      <p id="target-hint" class="section-hint">Pick a target format. Common choices are shown first.</p>
      <div id="category-tabs" class="category-tabs" aria-label="Format categories">
        <button type="button" class="selected">Popular</button>
        <button type="button">Images</button>
        <button type="button">Video</button>
        <button type="button">Audio</button>
        <button type="button">Documents</button>
        <button type="button">Text</button>
        <button type="button">Archives</button>
        <button type="button">Data</button>
        <button type="button">All</button>
      </div>
      <input type="text" id="search-to" class="search" placeholder="Search">
      <div id="to-list" class="format-list loading" aria-busy="true">
        <span class="format-skeleton"></span>
        <span class="format-skeleton"></span>
        <span class="format-skeleton"></span>
        <span class="format-skeleton"></span>
        <span class="format-skeleton"></span>
        <span class="format-skeleton"></span>
        <span class="format-skeleton"></span>
        <span class="format-skeleton"></span>
        <span class="format-skeleton"></span>
      </div>
    </div>

  </div>

  <div id="popup-bg"></div>
  <div id="popup">
    <h2>Loading tools...</h2>
  </div>

  <script type="module" src="src/main.ts"></script>

</body>
</html>
